name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, sqlite3
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint (syntax + deprecations)
        run: composer lint

      - name: Unit tests
        run: composer test

      - name: Security audit
        run: composer audit

  docker:
    name: Docker stack + setup wizard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Start PHP 8.5 + MySQL 9.7 stack
        run: docker compose up -d --build --wait

      - name: Smoke test (setup wizard, login, game pages, cron)
        run: tests/smoke.sh http://localhost:8080

      - name: Container logs
        if: failure()
        run: |
          docker compose logs
          docker compose exec -T app sh -c 'cat fuel/app/logs/*/*/*.php' || true

      - name: Tear down
        if: always()
        run: docker compose down -v
